        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* gray-900 */
            color: #e5e7eb; /* gray-200 */
        }
        .table-container { max-width: 100%; overflow-x: auto; }
        table { border-collapse: separate; border-spacing: 0; min-width: 1200px; }
        th, td { border: 1px solid #374151; padding: 12px; text-align: center; white-space: nowrap; }
        th { background-color: #1f2937; color: #d1d5db; font-weight: 600; position: sticky; top: 0; z-index: 10; }
        tr:nth-child(even) { background-color: #1f2937; }
        .win { background-color: rgba(16, 185, 129, 0.2); color: #a7f3d0; }
        .loss { background-color: rgba(239, 68, 68, 0.1); color: #f87171; }
        .tie { background-color: rgba(245, 158, 11, 0.1); color: #fbbf24; }
        .bye { color: #6b7280; font-style: italic; }
        tr.subtotal-row { background-color: #1e3a8a; color: #e0e7ff; font-weight: 700; }
        .section-winner { background-color: rgba(252, 211, 77, 0.25); border: 2px solid #f59e0b; color: #fef08a; }
        .chart-wrapper { background-color: #1f2937; border: 1px solid #374151; padding: 1.5rem; border-radius: 0.5rem; margin-top: 2rem; }
        .chart-container { position: relative; height: 350px; width: 100%; }
        nav a { padding: 6px 12px; font-size: 0.875rem; border-radius: 6px; transition: background-color 0.2s; cursor: pointer; }
        nav a.active { background-color: #3b82f6; color: white; font-weight: 500; }
        nav a:not(.active):hover { background-color: #374151; }
        .page-content { display: none; }
        .rules-content h3 { font-size: 1.25rem; font-weight: 600; color: #93c5fd; margin-top: 1.5rem; margin-bottom: 0.75rem; border-bottom: 1px solid #374151; padding-bottom: 0.5rem; }
        .rules-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .rules-content li { margin-bottom: 0.5rem; }
        .custom-legend { display: flex; flex-wrap: wrap; justify-content: center; padding: 0.5rem; background-color: white; border-radius: 0.5rem; margin-top: 1rem; }
        .legend-item { display: flex; align-items: center; margin: 2px 10px; font-size: 0.8rem; color: #1f2937; }
        .legend-key { position: relative; width: 24px; height: 12px; margin-right: 8px; }
        .legend-line { position: absolute; height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }
        .legend-marker { position: absolute; height: 8px; width: 8px; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px solid rgba(0,0,0,0.2); }

        // --- PAGE ROUTING LOGIC ---
        async function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(page => page.style.display = 'none');
            const pageElement = document.getElementById(`page-${pageId}`);
            pageElement.style.display = 'block';
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            const activeLink = document.querySelector(`a[onclick="showPage('${pageId}')"]`);
            if(activeLink) activeLink.classList.add('active');
            
            const subheading = document.getElementById('page-subheading');
            subheading.textContent = `${pageId} Scores & Standings`;

            if (pageElement.innerHTML.trim() === '') {
                await generateSeasonPage(pageId);
            }
        }
        
        async function generateSeasonPage(year) {
            const container = document.getElementById(`page-${year}`);
            const data = seasonData[year];
            if (!data) return;
            container.innerHTML = `<div id="content-container-${year}"><div class="text-center text-gray-400 p-8">Loading ${year} season data...</div></div>`;
            renderTableAndCharts(year);
        }

        function renderTableAndCharts(year, overrideData = null) {
            const data = overrideData || seasonData[year];
            const { owners, games, abbrMap, logoMap, currentWeek } = data;
            const WEEKS = (year < 2021) ? 17 : 18;
            
            const allGamesByWeek = new Map();
            for (let i = 1; i <= WEEKS; i++) allGamesByWeek.set(i, []);
            games.forEach(game => {
                const weekGames = allGamesByWeek.get(game.week);
                if (weekGames) weekGames.push(game);
            });

            const contentContainer = document.getElementById(`content-container-${year}`);
            contentContainer.innerHTML = `
                <div id="scores-table-container-${year}" class="table-container rounded-lg shadow-lg bg-[#151c2c] border border-gray-700">
                    <table class="w-full text-sm"><thead id="scores-table-head-${year}"></thead><tbody id="scores-table-body-${year}"></tbody></table>
                </div>
                <div id="charts-container-${year}"></div>
            `;
            const head = document.getElementById(`scores-table-head-${year}`);
            const body = document.getElementById(`scores-table-body-${year}`);
            const chartsContainer = document.getElementById(`charts-container-${year}`);
            head.innerHTML = ''; body.innerHTML = ''; chartsContainer.innerHTML = '';
            
            const headerRow = document.createElement('tr');
            headerRow.innerHTML = `<th>Wk</th>` + owners.map(o => {
                const teamFullName = abbrMap[o.teamAbbr] || ABBR_TO_TEAM_NAME_MAP[o.teamAbbr] || o.teamAbbr;
                const logoUrl = logoMap ? logoMap[o.teamAbbr] : '';
                const logoHtml = logoUrl ? `<img src="${logoUrl}" alt="${o.teamAbbr}" class="mx-auto h-8 w-8 mb-1">` : '';
                return `<th>${logoHtml}${o.name}<br><span class="font-normal text-gray-400 text-xs">${teamFullName}</span></th>`;
            }).join('');
            head.appendChild(headerRow);
            
            let sectionRecords = owners.map(() => ({w: 0, l: 0, t: 0, diff: 0}));
            let sectionPointDiffs = owners.map(() => [0]);
            const subtotalWeeks = (WEEKS === 18) ? [6, 12, 18] : [6, 12, 17];
            
            for (let week = 1; week <= WEEKS; week++) {
                const weekRow = document.createElement('tr');
                let rowContentHTML = `<td class="font-bold text-gray-300">${week}</td>`;
                const gamesThisWeek = allGamesByWeek.get(week) || [];
                
                owners.forEach((owner, ownerIndex) => {
                    const game = gamesThisWeek.find(g => g.home_team === owner.teamAbbr || g.away_team === owner.teamAbbr);
                    let pointDiffThisWeek = 0;

                    if (game) {
                        const isAway = game.away_team === owner.teamAbbr;
                        const opponentAbbr = isAway ? game.home_team : game.away_team;
                        const opponentFullName = abbrMap[opponentAbbr] || ABBR_TO_TEAM_NAME_MAP[opponentAbbr] || opponentAbbr;

                        if (game.home_score !== null && game.away_score !== null && !isNaN(game.home_score) && !isNaN(game.away_score)) {
                            const myTeamScore = isAway ? game.away_score : game.home_score;
                            const opponentScore = isAway ? game.home_score : game.away_score;
                            pointDiffThisWeek = myTeamScore - opponentScore;
                            sectionRecords[ownerIndex].diff += pointDiffThisWeek;
                            
                            let resultClass = 'tie';
                            if (pointDiffThisWeek > 0) { resultClass = 'win'; sectionRecords[ownerIndex].w++; }
                            else if (pointDiffThisWeek < 0) { resultClass = 'loss'; sectionRecords[ownerIndex].l++; }
                            else { sectionRecords[ownerIndex].t++; }
                            rowContentHTML += `<td class="${resultClass}"><div class="font-semibold">${myTeamScore} - ${opponentScore}</div><div class="text-xs text-gray-400">${isAway ? '@' : 'vs'} ${opponentFullName}</div></td>`;
                        } else {
                            rowContentHTML += `<td>${isAway ? '@' : 'vs'} ${opponentFullName}</td>`;
                        }
                    } else {
                        rowContentHTML += (week <= currentWeek) ? `<td class="bye">BYE</td>` : `<td>—</td>`;
                    }
                    const lastCumulative = sectionPointDiffs[ownerIndex][sectionPointDiffs[ownerIndex].length - 1];
                    sectionPointDiffs[ownerIndex].push(lastCumulative + pointDiffThisWeek);
                });
                weekRow.innerHTML = rowContentHTML;
                body.appendChild(weekRow);

                if (subtotalWeeks.includes(week)) { 
                    const sectionIndex = subtotalWeeks.indexOf(week);
                    const startWeek = (sectionIndex === 0) ? 1 : subtotalWeeks[sectionIndex - 1] + 1;
                    
                    if (currentWeek >= week) {
                        let winnerIndex = -1;
                        if (games.some(g => g.week >= startWeek && g.week <= week)) {
                            let maxWins = -1;
                            sectionRecords.forEach(r => { if (r.w > maxWins) maxWins = r.w; });
                            const potentialWinners = sectionRecords.map((r, i) => ({...r, index: i})).filter(r => r.w === maxWins && r.w > r.l);
                            
                            if (potentialWinners.length === 1) {
                                winnerIndex = potentialWinners[0].index;
                            } else if (potentialWinners.length > 1) {
                                let maxDiff = -Infinity;
                                let winner = null;
                                potentialWinners.forEach(p => { 
                                    if (p.diff > maxDiff) { 
                                        maxDiff = p.diff; 
                                        winner = p;
                                    }
                                });
                                if(winner) winnerIndex = winner.index;
                            }
                        }

                        const subtotalRow = document.createElement('tr');
                        subtotalRow.className = 'subtotal-row';
                        let subtotalHtml = `<td>Rec (Wk ${startWeek}-${week})</td>`;
                        sectionRecords.forEach((record, i) => {
                            const highlightClass = (i === winnerIndex) ? 'section-winner' : '';
                            subtotalHtml += `<td class="${highlightClass}">${record.w}-${record.l}${record.t > 0 ? `-${record.t}` : ''}</td>`;
                        });
                        subtotalRow.innerHTML = subtotalHtml;
                        body.appendChild(subtotalRow);

                        const chartLabels = Array.from({length: (week - startWeek + 1)}, (_, i) => `Wk ${startWeek + i}`);
                        chartLabels.unshift(`Start`);
                        const chartDatasets = owners.map((owner, i) => ({
                            label: owner.teamAbbr, data: sectionPointDiffs[i],
                            borderColor: teamLineColors[owner.teamAbbr] || '#888',
                            pointBackgroundColor: teamMarkerColors[owner.teamAbbr] || '#888',
                            pointBorderColor: teamMarkerColors[owner.teamAbbr] || '#888',
                            pointRadius: 4, tension: 0.1, fill: false
                        }));
                        const chartTitle = `Cumulative Point Differential: Weeks ${startWeek}-${week}`;
                        const canvasId = `chart-${year}-section-${sectionIndex}`;
                        const legendId = `legend-${year}-section-${sectionIndex}`;
                        chartsContainer.innerHTML += `
                            <div class="chart-wrapper">
                                <h3 class="text-xl font-bold text-center mb-4">${chartTitle}</h3>
                                <div class="chart-container"><canvas id="${canvasId}"></canvas></div>
                                <div id="${legendId}" class="custom-legend"></div>
                            </div>`;
                        renderChart(canvasId, legendId, chartLabels, chartDatasets);
                    }
                    
                    sectionRecords = owners.map(() => ({w: 0, l: 0, t: 0, diff: 0}));
                    sectionPointDiffs = owners.map(() => [0]);
                }
            }
        }

        function renderChart(canvasId, legendId, labels, datasets) {
            const whiteBackgroundPlugin = {
                id: 'customCanvasBackgroundColor',
                beforeDraw: (chart) => {
                    const { ctx } = chart;
                    ctx.save();
                    ctx.globalCompositeOperation = 'destination-over';
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, chart.width, chart.height);
                    ctx.restore();
                }
            };
            setTimeout(() => {
                const legendContainer = document.getElementById(legendId);
                 if (!legendContainer) return;
                legendContainer.innerHTML = '';
                datasets.forEach(dataset => {
                    const legendItem = document.createElement('div');
                    legendItem.className = 'legend-item';
                    legendItem.innerHTML = `
                        <div class="legend-key">
                            <div class="legend-line" style="background-color: ${dataset.borderColor};"></div>
                            <div class="legend-marker" style="background-color: ${dataset.pointBackgroundColor};"></div>
                        </div>
                        <span>${dataset.label}</span>
                    `;
                    legendContainer.appendChild(legendItem);
                });

                const ctx = document.getElementById(canvasId);
                if (!ctx) return;
                new Chart(ctx.getContext('2d'), {
                    type: 'line', data: { labels, datasets }, plugins: [whiteBackgroundPlugin],
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        scales: {
                            y: { ticks: { color: '#1f2937' }, grid: { color: '#d1d5db' } },
                            x: { ticks: { color: '#1f2937' }, grid: { display: false } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            }, 0);
        }

        function parseCsvData(csvText) {
            const games = [];
            const abbrToFullNameMap = {};
            const lines = csvText.split('\n').slice(1);
            for (const line of lines) {
                const cols = line.split(',');
                if (cols.length < 6) continue;
                const homeTeamName = cols[4].trim();
                const awayTeamName = cols[2].trim();
                const homeTeamAbbr = TEAM_NAME_TO_ABBR_MAP[homeTeamName] || homeTeamName;
                const awayTeamAbbr = TEAM_NAME_TO_ABBR_MAP[awayTeamName] || awayTeamName;
                
                if (homeTeamAbbr !== homeTeamName) abbrToFullNameMap[homeTeamAbbr] = homeTeamName;
                if (awayTeamAbbr !== awayTeamName) abbrToFullNameMap[awayTeamAbbr] = awayTeamName;

                games.push({
                    week: parseInt(cols[0]),
                    date: cols[1].trim(),
                    home_team: homeTeamAbbr,
                    home_score: parseInt(cols[5]),
                    away_team: awayTeamAbbr,
                    away_score: parseInt(cols[3]),
                });
            }
            return { games, abbrToFullNameMap };
        }
