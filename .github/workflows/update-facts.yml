name: Update NFL Facts

on:
  schedule:
    # Runs automatically every Tuesday at 10:00 AM UTC (after Monday Night Football)
    - cron: '0 10 * * 2'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  refresh-facts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python scripts/update_facts.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add facts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: NFL facts & stats" && git push)
