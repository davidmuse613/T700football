<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T700 - Turd Ferguson Award</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: #e5e7eb; }
        .table-container { max-width: 100%; overflow-x: auto; }
        table { border-collapse: separate; border-spacing: 0; min-width: 1200px; }
        th, td { border: 1px solid #374151; padding: 8px; text-align: center; white-space: nowrap; }
        th { background-color: #1f2937; color: #d1d5db; font-weight: 600; position: sticky; top: 0; z-index: 10; }
        tr:nth-child(even) { background-color: #1f2937; }
        .tfa-winner { background-color: #a16207; color: #fef08a; } 
        .tfa-loser { background-color: #166534; color: #a7f3d0; } 
    </style>
</head>
<body class="bg-gray-900">

    <nav class="w-full bg-gray-800 shadow-md">
        <div class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-8">
            <div class="flex justify-center items-center h-12">
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <a href="index.html" class="nav-link">Live Season (2025)</a>
                    <a href="archive.html" class="nav-link">Seasons Archive</a>
                    <a href="#" class="nav-link active">Turd Ferguson Award</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 sm:p-6 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-white">💩 Turd Ferguson Award 💩</h1>
            <p class="text-lg text-gray-400 mt-2">2025 Season Analysis</p>
        </header>
        <div id="tfa-container" class="table-container">
            <div class="text-center p-8">Loading award data...</div>
        </div>
    </div>

    <script>
        const SPREADS_API_KEY = 'cb952abc30dff15066120754a630f558';
        const SCORES_API_KEY = '123';
        const NFL_LEAGUE_ID = '4391';
        const YEAR = '2025';

        const TEAM_NAME_TO_ABBR_MAP = { 'Atlanta Falcons': 'ATL', 'Carolina Panthers': 'CAR', 'Cincinnati Bengals': 'CIN', 'Detroit Lions': 'DET', 'Green Bay Packers': 'GNB', 'Los Angeles Chargers': 'LAC', 'Las Vegas Raiders': 'LVR', 'New England Patriots': 'NWE', 'New York Giants': 'NYG', 'Pittsburgh Steelers': 'PIT', 'Tampa Bay Buccaneers': 'TAM', 'Seattle Seahawks': 'SEA', 'Dallas Cowboys': 'DAL' };

        const owners = [ { name: "Greg", teamAbbr: "ATL" }, { name: "Ethan, Johnny, Bobby", teamAbbr: "CAR" }, { name: "Danger", teamAbbr: "CIN" }, { name: "Nick", teamAbbr: "DET" }, { name: "David, Bob", teamAbbr: "GNB" }, { name: "Russ", teamAbbr: "LVR" }, { name: "Stefan", teamAbbr: "LAC" }, { name: "Chuck", teamAbbr: "NWE" }, { name: "Pat", teamAbbr: "NYG" }, { name: "Kyle", teamAbbr: "PIT" } ];
        const teamAbbrs = owners.map(o => o.teamAbbr);

        async function fetchAllData() {
            const scoresUrl = `https://www.thesportsdb.com/api/v1/json/${SCORES_API_KEY}/eventsseason.php?id=${NFL_LEAGUE_ID}&s=${YEAR}`;
            const spreadsUrl = `https://api.sportsgameodds.com/v2/odds?sport=nfl`;
            
            try {
                const [scoresResponse, spreadsResponse] = await Promise.all([
                    fetch(scoresUrl),
                    fetch(spreadsUrl, { headers: { 'X-Api-Key': SPREADS_API_KEY } })
                ]);
                const scoresData = await scoresResponse.json();
                const spreadsData = await spreadsResponse.json();
                const spreads = spreadsData?.data || [];

                processAndRenderData(scoresData.events || [], spreads);
            } catch (error) {
                document.getElementById('tfa-container').innerHTML = `<div class="text-center text-red-400 p-8">Failed to load data. Please try again later.</div>`;
                console.error("Error fetching data:", error);
            }
        }

        function getSpreadValue(game) {
            if (!game.odds) return null;
            const draftkings = game.odds['points-home-game-sp-home']?.byBookmaker?.draftkings
                || game.odds['points-home']?.byBookmaker?.draftkings
                || Object.values(game.odds)[0]?.byBookmaker?.draftkings;
            return draftkings ? parseFloat(draftkings.spread) : null;
        }

        function processAndRenderData(scores, spreads) {
            const weeklyData = {};

            scores.forEach(game => {
                const week = parseInt(game.intRound);
                if (!week) return;
                if (!weeklyData[week]) weeklyData[week] = {};
                const home = TEAM_NAME_TO_ABBR_MAP[game.strHomeTeam];
                const away = TEAM_NAME_TO_ABBR_MAP[game.strAwayTeam];
                if (teamAbbrs.includes(home) && game.intHomeScore) {
                    weeklyData[week][home] = { diff: parseInt(game.intHomeScore) - parseInt(game.intAwayScore) };
                }
                if (teamAbbrs.includes(away) && game.intAwayScore) {
                    weeklyData[week][away] = { diff: parseInt(game.intAwayScore) - parseInt(game.intHomeScore) };
                }
            });

            spreads.forEach(game => {
                const weekInfo = game.info?.seasonWeek?.split(" ") || [];
                const weekString = weekInfo.find(s => s.startsWith("W"));
                const week = weekString ? parseInt(weekString.replace("W", "")) : null;
                if (!week || !weeklyData[week]) return;
                const home = TEAM_NAME_TO_ABBR_MAP[game.teams.home.names.long];
                const away = TEAM_NAME_TO_ABBR_MAP[game.teams.away.names.long];
                const spread = getSpreadValue(game);
                if (spread !== null) {
                    if (teamAbbrs.includes(home)) weeklyData[week][home].spread = spread;
                    if (teamAbbrs.includes(away)) weeklyData[week][away].spread = -spread;
                }
            });

            const highlights = {};
            for (let w = 1; w <= 18; w++) {
                if (!weeklyData[w]) continue;
                let maxF = -Infinity, minF = Infinity, maxT = null, minT = null;
                teamAbbrs.forEach(t => {
                    const d = weeklyData[w][t];
                    if (d && typeof d.diff === 'number' && typeof d.spread === 'number') {
                        d.final = d.diff + d.spread;
                        if (d.final > maxF) { maxF = d.final; maxT = t; }
                        if (d.final < minF) { minF = d.final; minT = t; }
                    }
                });
                highlights[w] = { winner: maxT, loser: minT };
            }
            renderTable(weeklyData, highlights);
        }

        function renderTable(weeklyData, highlights) {
            let tableHtml = `<table class="w-full text-sm"><thead><tr><th rowspan="2">Team</th>`;
            for (let i = 1; i <= 18; i++) tableHtml += `<th colspan="3">Week ${i}</th>`;
            tableHtml += `</tr><tr>`;
            for (let i = 1; i <= 18; i++) tableHtml += `<th>Pred</th><th>Actual</th><th>Final</th>`;
            tableHtml += `</tr></thead><tbody>`;

            owners.forEach(o => {
                tableHtml += `<tr><td class="font-bold">${o.name} (${o.teamAbbr})</td>`;
                for (let w = 1; w <= 18; w++) {
                    const d = weeklyData[w] ? weeklyData[w][o.teamAbbr] : null;
                    const cellClass = (highlights[w]?.winner === o.teamAbbr) ? 'tfa-winner' :
                                      (highlights[w]?.loser === o.teamAbbr) ? 'tfa-loser' : '';
                    const spread = d?.spread !== undefined ? (d.spread > 0 ? '+'+d.spread : d.spread) : '—';
                    const diff = d?.diff !== undefined ? (d.diff > 0 ? '+'+d.diff : d.diff) : '—';
                    const final = d?.final !== undefined ? (d.final > 0 ? '+'+d.final.toFixed(1) : d.final?.toFixed(1)) : '—';
                    tableHtml += `<td class="${cellClass}">${spread}</td><td class="${cellClass}">${diff}</td><td class="${cellClass}">${final}</td>`;
                }
                tableHtml += `</tr>`;
            });

            tableHtml += `</tbody></table>`;
            document.getElementById('tfa-container').innerHTML = tableHtml;
        }

        document.addEventListener('DOMContentLoaded', fetchAllData);
    </script>
</body>
</html>
