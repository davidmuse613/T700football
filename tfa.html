<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Turd Ferguson Award</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #111827; color: #e5e7eb; font-family: sans-serif; }
    .table-container { overflow-x: auto; margin: 1em; }
    table { border-collapse: collapse; min-width: 1000px; width: 100%; }
    th, td { border: 1px solid #374151; padding: 8px; text-align: center; }
    th { background-color: #1f2937; color: #d1d5db; position: sticky; top: 0; }
    tr:nth-child(even) { background-color: #1f2937; }
    .tfa-winner { background-color: #a16207; color: #fef08a; }
    .tfa-loser { background-color: #166534; color: #a7f3d0; }
    .error { color: #f87171; padding: 1em; text-align: center; }
  </style>
</head>
<body>
  <nav class="bg-gray-800 p-4">
    <a href="index.html" class="mr-4">Scores</a>
    <a href="#" class="font-bold">Turd Ferguson Award</a>
  </nav>
  <header class="text-center mt-6">
    <h1 class="text-3xl font-bold">💩 Turd Ferguson Award 💩</h1>
  </header>
  <div id="tfa-container" class="table-container">
    <div class="error">Loading data...</div>
  </div>

<script>
const SPREADS_API_URL =
  "https://api.sportsgameodds.com/v2/events/?leagueID=NFL&bookmakerID=draftkings&finalized=true&ended=true&startsAfter=2025-09-01&startsBefore=2026-02-01&apiKey=cb952abc30dff15066120754a630f558";
const SCORES_API_KEY = "123";
const NFL_LEAGUE_ID = "4391";
const YEAR = "2025";

const TEAM_NAME_TO_ABBR_MAP = {
  "Atlanta Falcons": "ATL",
  "Carolina Panthers": "CAR",
  "Cincinnati Bengals": "CIN",
  "Detroit Lions": "DET",
  "Green Bay Packers": "GNB",
  "Los Angeles Chargers": "LAC",
  "Las Vegas Raiders": "LVR",
  "New England Patriots": "NWE",
  "New York Giants": "NYG",
  "Pittsburgh Steelers": "PIT",
};

const owners = [
  { name: "Greg", teamAbbr: "ATL" },
  { name: "Ethan, Johnny, Bobby", teamAbbr: "CAR" },
  { name: "Danger", teamAbbr: "CIN" },
  { name: "Nick", teamAbbr: "DET" },
  { name: "David, Bob", teamAbbr: "GNB" },
  { name: "Russ", teamAbbr: "LVR" },
  { name: "Stefan", teamAbbr: "LAC" },
  { name: "Chuck", teamAbbr: "NWE" },
  { name: "Pat", teamAbbr: "NYG" },
  { name: "Kyle", teamAbbr: "PIT" },
];
const teamAbbrs = owners.map((o) => o.teamAbbr);

async function fetchAllData() {
  const scoresUrl = `https://www.thesportsdb.com/api/v1/json/${SCORES_API_KEY}/eventsseason.php?id=${NFL_LEAGUE_ID}&s=${YEAR}`;
  console.log("Fetching scores from:", scoresUrl);

  try {
    const [scoresResp, spreadsResp] = await Promise.all([
      fetch(scoresUrl),
      fetch(SPREADS_API_URL),
    ]);

    if (!scoresResp.ok) throw new Error(`Scores API error: ${scoresResp.status}`);
    if (!spreadsResp.ok) throw new Error(`Spreads API error: ${spreadsResp.status}`);

    const scoresJson = await scoresResp.json();
    const spreadsJson = await spreadsResp.json();

    console.log("Scores JSON:", scoresJson);
    console.log("Spreads JSON:", spreadsJson);

    processAndRenderData(scoresJson.events || [], spreadsJson.data || []);
  } catch (err) {
    console.error("Fetch or JSON error:", err);
    document.getElementById(
      "tfa-container"
    ).innerHTML = `<div class="error">Failed to load data: ${err.message}</div>`;
  }
}

function extractDraftKingsSpread(oddsObj, side) {
  if (!oddsObj) return null;
  const candidates = [
    `points-${side}-game-sp-${side}`,
    `points-${side}`,
    "spread",
  ];
  for (const key of candidates) {
    const val = oddsObj[key]?.byBookmaker?.draftkings?.spread;
    if (typeof val === "number") return val;
  }
  return null;
}

function processAndRenderData(events, spreads) {
  const weeklyData = {};

  events.forEach((game) => {
    const week = parseInt(game.intRound);
    if (!week) return;
    if (!weeklyData[week]) weeklyData[week] = {};

    const home = TEAM_NAME_TO_ABBR_MAP[game.strHomeTeam];
    const away = TEAM_NAME_TO_ABBR_MAP[game.strAwayTeam];
    if (teamAbbrs.includes(home) && game.intHomeScore !== null) {
      weeklyData[week][home] = {
        diff: parseInt(game.intHomeScore) - parseInt(game.intAwayScore),
      };
    }
    if (teamAbbrs.includes(away) && game.intAwayScore !== null) {
      weeklyData[week][away] = {
        diff: parseInt(game.intAwayScore) - parseInt(game.intHomeScore),
      };
    }
  });

  spreads.forEach((game) => {
    const weekStr = game.info?.seasonWeek;
    if (!weekStr || !weekStr.startsWith("W")) return;
    const wk = parseInt(weekStr.slice(1));
    if (!wk) return;
    if (!weeklyData[wk]) weeklyData[wk] = {};

    const home = TEAM_NAME_TO_ABBR_MAP[game.teams.home.names.long];
    const away = TEAM_NAME_TO_ABBR_MAP[game.teams.away.names.long];

    const dkHome = extractDraftKingsSpread(game.odds, "home");
    const dkAway = extractDraftKingsSpread(game.odds, "away");

    if (teamAbbrs.includes(home) && dkHome !== null)
      (weeklyData[wk][home] ||= {}).spread = dkHome;
    if (teamAbbrs.includes(away) && dkAway !== null)
      (weeklyData[wk][away] ||= {}).spread = dkAway;
  });

  const highlights = {};
  for (let w = 1; w <= 18; w++) {
    if (!weeklyData[w]) continue;
    let maxF = -Infinity,
      minF = Infinity,
      maxT = null,
      minT = null;
    teamAbbrs.forEach((t) => {
      const d = weeklyData[w][t];
      if (!d) return;
      if (typeof d.diff === "number" && typeof d.spread === "number") {
        d.final = d.diff - d.spread;
        if (d.final > maxF) {
          maxF = d.final;
          maxT = t;
        }
        if (d.final < minF) {
          minF = d.final;
          minT = t;
        }
      }
    });
    highlights[w] = { winner: maxT, loser: minT };
  }

  renderTable(weeklyData, highlights);
}

function renderTable(weeklyData, highlights) {
  let html = `<table><thead><tr><th>Team</th>`;
  for (let w = 1; w <= 18; w++) html += `<th colspan="3">Wk ${w}</th>`;
  html += `</tr><tr>`;
  for (let w = 1; w <= 18; w++) html += `<th>Spread</th><th>Final</th><th>Δ</th>`;
  html += `</tr></thead><tbody>`;

  owners.forEach((o) => {
    html += `<tr><td>${o.name} (${o.teamAbbr})</td>`;
    for (let w = 1; w <= 18; w++) {
      const d = weeklyData[w]?.[o.teamAbbr];
      const cls =
        highlights[w]?.winner === o.teamAbbr
          ? "tfa-winner"
          : highlights[w]?.loser === o.teamAbbr
          ? "tfa-loser"
          : "";
      const spr =
        d?.spread !== undefined
          ? d.spread > 0
            ? `+${d.spread}`
            : `${d.spread}`
          : "—";
      const fin =
        d?.diff !== undefined
          ? d.diff > 0
            ? `+${d.diff}`
            : `${d.diff}`
          : "—";
      const delta =
        d?.final !== undefined
          ? d.final > 0
            ? `+${d.final.toFixed(1)}`
            : `${d.final.toFixed(1)}`
          : "—";
      html += `<td class="${cls}">${spr}</td><td class="${cls}">${fin}</td><td class="${cls}">${delta}</td>`;
    }
    html += `</tr>`;
  });

  html += `</tbody></table>`;
  document.getElementById("tfa-container").innerHTML = html;
}
window.debugData = { weeklyData, spreads }; 
console.log("Debug data:", window.debugData);

window.addEventListener("DOMContentLoaded", fetchAllData);
</script>
</body>
</html>
